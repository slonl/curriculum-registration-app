<!DOCTYPE html>
<title>SLO Curriculum Browser</title>
<link rel="stylesheet" href="/assets/css/slo.css">
<body>
<base href="{@NODE_DATA_URL}">
<div class="slo-header">
    <img class="slo-logo" src="/img/header-logo-opendata.svg" alt="SLO / opendata">
</div>
<main class="slo-main">
    <nav class="slo-menu" data-simply-path="/">
        <div data-simply-list="menu">
            <template>
                <details>
                    <summary data-simply-field="title"></summary>
                    <ul class="slo-submenu" data-simply-list="submenu">
                        <template>
                            <li class="slo-submenu-item"><a class="slo-nav" href="#" data-simply-field="link" data-simply-group="menu"
                                data-simply-command="simply-select">link</a></li>
                        </template>
                    </ul>
                </details>
            </template>
        </div>
        <ul class="slo-submenu slo-submenu-extra" data-simply-list="submenu">
            <template>
                 <li class="slo-submenu-item"><a href="#"
                 data-simply-field="link" data-simply-group="menu"
                 data-simply-command="simply-select">Contact</a></li>
            </template>
        </ul>
    </nav>
    <div class="slo-content-panel">
        <div class="error" data-simply-field="error"></div>
            
        <section class="slo-text-content" data-simply-field="view" data-simply-content="template">
            <template data-simply-template="register">
                <h1>API Key registreren</h1>
                <p>Vul hier het e-mailadres in. De API key wordt naar dit adres toegestuurd.</p>
                <div class="slo-error" data-simply-field="registerError"></div>
                <form data-simply-command="register" method="GET">
                    <label>E-mail:
                        <input type="text" name="email">
                    </label>
                    <input type="submit" class="slo-button" value="Registreren">
                </form>
            </template>
            <template data-simply-template="registered">
                <h1>Bedankt!</h1>
                <p>De API key wordt binnen een aantal uur per e-mail verstuurd.</p>
            </template>
        </section>
    </div>
</main>
<footer class="slo-footer ds-bg-primary-dark ds-dark-background" data-simply-path="/">

    <nav class="slo-footer-menu">
        <ul class="slo-nav" data-simply-list="footer-menu" data-simply-sortable>
            <template>
                <li><a href="#" data-simply-field="link">Contact</a></li>
            </template>
        </ul>

</footer>

<script src="//cdn.simplyedit.io/1/simply-edit.js"
    data-api-key="flashy-leather-7944"
    data-simply-images="/img/"
    data-simply-files="/files/"
    data-simply-settings="seSettings"
    data-storage-get-post-only
></script>
<script src="//unpkg.com/simplyview@2.0.1/dist/simply.everything.js"></script>
<script>
    var browser = simply.app({
        container: document.body,
        routes: {        
            '/': function(params) {
                browser.view.view = 'register';
            }
        },
        commands: {
            register : async function(form, values) {
                await browser.actions.register(values.email);
            }
        },
        actions: {
            register : async function(email) {
                browser.view.error = '';
                try {
                    await api.register(email);
                    browser.view.view = "registered";
                } catch(err) {
                    if (err.error) {
                        browser.view.error = err.error
                    } else {
                        browser.view.error = err.message
                    }
                }
            }
        }
    });

    const api = {
        register: async function(email) {
            const url = 'register?email='+encodeURIComponent(email);
            const response = await fetch(url, {
                headers: {
                    'Accept': 'application/json'
                }
            })
            let message = await response.text();
            try {
                message = JSON.parse(message);
            } catch(err) {
                throw new Error(message);
            }
            if (response.ok) {
                return message
            } else {
                throw message
            }
        }
    }
    
    document.addEventListener('simply-content-loaded', function(evt) {
        var menu = editor.currentData['/']?.menu;
        if (menu && menu[1]) {
            var api = menu[1].submenu[0]['data-simply-template'] = 'api';
        }
    });

</script>
</body>
